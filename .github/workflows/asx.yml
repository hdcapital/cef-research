name: asx-backtest

# Australian LIC/LIT study: download monthly investment-products reports
# (cached), build the panel, run the shared-engine backtest, commit
# outputs/au. Trigger via '[asx]' commit tag during development;
# workflow_dispatch and a monthly schedule once on the default branch.

on:
  workflow_dispatch:
    inputs:
      sweep_budget:
        description: "index calls this run (gap fill needs ~750+)"
        default: "2000"
  schedule:
    - cron: "0 7 16 * *"   # monthly, after mid-month report publication
    - cron: "0 7 4 * *"    # early-month: month-end NTA PDFs still in the
                           # public 5-item window -> independent numeric check
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

concurrency:
  group: asx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[asx]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m pytest tests/ -q

      - name: Restore ASX raw cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/asx
            data/cache/asx
            data/au_manifest.csv
          key: asx-raw-v1-${{ github.run_id }}
          restore-keys: |
            asx-raw-v1-

      - name: Download monthly reports
        run: python -m au_lic.cli download

      - name: Save ASX raw cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/asx
            data/cache/asx
            data/au_manifest.csv
          key: asx-raw-v1-${{ github.run_id }}

      - name: Build panel
        run: python -m au_lic.cli build-panel

      - name: Backtest
        run: python -m au_lic.cli backtest

      # The announcement index and its sweep state are the authoritative
      # record of what has been crawled; the Actions cache is evictable and
      # a lost sweep_state.json restarts the history sweep from scratch.
      - name: Restore announcement index from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python scripts/sync_state.py pull --groups asx_index
      - name: Restore announcements cache
        uses: actions/cache/restore@v4
        with:
          path: data/asx_ann_cache
          key: asx-ann-v1-${{ github.run_id }}
          restore-keys: |
            asx-ann-v1-

      - name: Announcements crawl + cross-validation
        run: python -m au_lic.cli announcements --budget-minutes 60

      - name: Sampled NTA PDF numeric validation
        env:
          # a 2.5-year market-wide gap is ~750 index calls; the old inner cap
          # of 60 could never close it however large this was
          NTA_SWEEP_BUDGET: ${{ github.event.inputs.sweep_budget || '2000' }}
        run: python scripts/sample_nta_pdfs.py || true
      - name: Persist announcement index to S3
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python scripts/sync_state.py push --groups asx_index

      - name: Save announcements cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/asx_ann_cache
          key: asx-ann-v1-${{ github.run_id }}

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: au-outputs
          path: |
            outputs/au/
            data/au_manifest.csv
          if-no-files-found: warn

      # was `if: github.event_name == 'push'`, so a dispatched run wrote its
      # status nowhere and every diagnosis needed log archaeology. A run that
      # produces a status must commit it however it was started.
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/au data/au_manifest.csv \
            data/asx_ann_cache/asx1/lic_announcement_index.parquet \
            data/asx_ann_cache/asx1/sweep_state.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "CI: AU backtest outputs ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
