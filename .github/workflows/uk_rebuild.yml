name: uk-nav-rebuild

# Recover UK NAV rows the archiver lost.
#
# archive_uk_navs.py marks an announcement done in the S3 manifest on PUT,
# but the parsed row only becomes durable at the end-of-run parquet commit.
# Runs that died in between left the text in S3 with no row in the parquet,
# and the manifest then blocked any re-fetch forever - which is why the
# committed history has no 2023 or 2024 at all while the archiver reports
# queue_remaining: 0. This job rebuilds those rows from the S3 archive.
# It makes no Investegate request: it re-derives already-collected
# observations from their stored source text.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Number of parallel shards"
        default: "6"
      deadline_min:
        description: "Per-shard wall-clock budget (minutes)"
        default: "240"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    concurrency:
      group: uk-rebuild-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: false
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Rebuild from S3 archive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shards || '6' }}
          UK_REBUILD_DEADLINE_MIN: ${{ inputs.deadline_min || '240' }}
        run: python scripts/rebuild_uk_nav_history.py
      - name: Commit rebuilt rows
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # add each path independently: `git add -f A B` aborts wholesale
          # if any one path is missing, which has silently dropped commits
          for p in data/uk_nav_history_rebuild_*.parquet outputs/live/uk_nav_rebuild_status_*.json; do
            [ -e "$p" ] && git add -f "$p" || true
          done
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "CI: UK NAV rebuild shard ${{ matrix.shard }} ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4 5 6; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              sleep $((RANDOM % 15 + 5))
            done
          fi
