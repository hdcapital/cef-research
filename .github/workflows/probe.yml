name: probe-aic-archive

# Diagnostics workflow: runs a probe/diagnostic script on a GitHub runner
# (the dev sandbox has no egress to theaic.co.uk) with the shared raw-data
# cache mounted, and commits small findings back to the branch.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "probe script to run"
        default: "scripts/probe_ticker_sources.py"
      state_groups:
        description: "S3 state groups to restore (comma list)"
        default: "raw_aic"
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt boto3 && pip install -e .
      - name: Restore state from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python scripts/sync_state.py pull --groups "${{ github.event.inputs.state_groups || 'raw_aic' }}"
      - name: Restore raw-data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/cache
            data/manifest.csv
          key: aic-raw-v1-${{ github.run_id }}
          restore-keys: |
            aic-raw-v1-
      - name: Run diagnostic script
        run: |
          for kv in $(echo "${{ github.event.inputs.extra_env }}" | tr ";" " "); do export "$kv"; done
          python "${{ github.event.inputs.script || 'scripts/probe_ticker_sources.py' }}"
      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/probe reports/build
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Probe: parser/unit diagnostics"
            for i in 1 2 3 4 5 6; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              sleep $((RANDOM % 15 + 5))
            done
          fi
