name: probe-aic-archive

# Diagnostics workflow: runs a probe/diagnostic script on a GitHub runner
# (the dev sandbox has no egress to theaic.co.uk) with the shared raw-data
# cache mounted, and commits small findings back to the branch.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Restore raw-data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/cache
            data/manifest.csv
          key: aic-raw-v1-${{ github.run_id }}
          restore-keys: |
            aic-raw-v1-
      - name: Run diagnostic script
        run: |
          python scripts/probe_ticker_sources.py
      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/probe reports/build
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Probe: parser/unit diagnostics"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
