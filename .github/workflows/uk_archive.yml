name: uk-nav-archive

# UK daily-NAV history backfill: walks the Investegate NAV-announcement
# index newest-first, parses cum/ex-income NAVs into the committed
# data/uk_nav_history.parquet, archives announcement text to S3
# (append-only, manifest-resumable). Recent 24 months land in ~10 nightly
# runs; the 2006+ deep history follows - the dataset that lets the
# intramonth-timeliness hypothesis be backtested directly.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"     # nightly, after the ASX archive window opens
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

concurrency:
  group: uk-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ukarchive]')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt boto3 && pip install -e .
      - name: Restore Investegate cache
        uses: actions/cache/restore@v4
        with:
          path: data/investegate_cache
          key: investegate-v1-${{ github.run_id }}
          restore-keys: |
            investegate-v1-
      - name: Backfill UK NAV history
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python scripts/archive_uk_navs.py
      - name: Commit history + status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/uk_nav_history.parquet outputs/live/uk_nav_archive_status.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "CI: UK NAV history backfill ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
