name: dividends-backfill

# Resumable Investegate crawl (dividends + announcement-dated catalysts).
# Each run: restore crawl state from cache -> rebuild panel from cached AIC
# raw data -> crawl within a wall-clock budget -> save state, upload
# coverage. Triggered nightly (by tagged pushes while on a topic branch;
# the cron activates once merged to the default branch).

on:
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Crawl budget (minutes)"
        required: false
        default: "250"
  schedule:
    - cron: "30 6 13 * *"  # monthly, the day after the backtest's AIC refresh
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

concurrency:
  group: dividends-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[divs]')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .

# NOTE: the restore path list must EXACTLY match the list backtest.yml
      # saves with - actions/cache versions the archive by its path list, so
      # a different list is a guaranteed cache miss.
      - name: Restore AIC raw cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/cache
            data/manifest.csv
          key: aic-raw-v1-${{ github.run_id }}
          restore-keys: |
            aic-raw-v1-

      - name: Restore crawl state
        uses: actions/cache/restore@v4
        with:
          path: data/investegate_cache
          key: investegate-v1-${{ github.run_id }}
          restore-keys: |
            investegate-v1-

      - name: Build panel (needed for the ticker map)
        run: |
          python -m uk_cef.cli build-entities
          python -m uk_cef.cli build-panel

      - name: Crawl
        run: |
          B="${{ inputs.budget_minutes }}"
          python -m uk_cef.cli dividends --budget-minutes "${B:-250}"

      - name: Save crawl state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/investegate_cache
          key: investegate-v1-${{ github.run_id }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investegate-coverage
          path: |
            outputs/investegate_coverage.csv
            outputs/investegate_missing_tickers.csv
            data/processed/dividends.parquet
            data/processed/catalysts_announced.parquet
          if-no-files-found: warn

      - name: Commit coverage summary
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/investegate_coverage.csv outputs/investegate_missing_tickers.csv \
                     outputs/dividends_sample.csv outputs/dividends_parse_summary.json || true
          # the processed dividend/catalyst tables are small and committing
          # them makes the backtest pipeline independent of the crawl cache
          git add -f data/processed/dividends.parquet data/processed/catalysts_announced.parquet || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "CI: investegate crawl coverage ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
