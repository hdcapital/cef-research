name: asx-extract

# Converts the archived ASX announcement PDFs into point-in-time structured
# facts (config/prompts/asx_extraction_v1.md). Reads only what the archive
# already holds - nothing is re-fetched from the ASX.
#
# Modes: queue (free, counts what is outstanding), sync (a small sample, for
# validating the prompt against real documents), submit/collect (the Batches
# API at half price, for the corpus).
#
# Skips cleanly when ANTHROPIC_API_KEY is absent, so the rest of the pipeline
# is never blocked on it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deterministic | diagnose | prices | queue | estimate | compare | sync | submit | collect"
        default: "deterministic"
      limit:
        description: "documents to process"
        default: "10"
      batch_id:
        description: "batch id (collect mode only)"
        default: ""
      tier:
        description: "cheap | expensive (uses the repo's CHEAP_MODEL / EXPENSIVE_MODEL)"
        default: "cheap"
      model:
        description: "explicit model id, overrides tier (optional)"
        default: ""

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    concurrency:
      group: asx-extract-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: false
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt boto3 anthropic && pip install -e .
      # the contract is enforced in code; a regression fails before any spend
      - run: python -m pytest tests/test_asx_extraction_guards.py -q
      - name: Restore announcement index from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python scripts/sync_state.py pull --groups asx_index
      - name: Extract
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_SECRET_KEY || secrets.ANTHROPIC_API_KEY }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "8"
          # explicit id wins; otherwise the tier picks one of the repo's
          # configured model variables. No model id is hardcoded here.
          EXTRACT_MODEL: ${{ github.event.inputs.model || (github.event.inputs.tier == 'expensive' && vars.EXPENSIVE_MODEL || vars.CHEAP_MODEL) }}
          # compare mode runs the tiers head to head
          COMPARE_MODELS: ${{ vars.CHEAP_MODEL }},${{ vars.EXPENSIVE_MODEL }}
        run: |
          python -m au_lic.extract.runner "${{ github.event.inputs.mode }}" \
            --limit "${{ github.event.inputs.limit }}" \
            ${{ github.event.inputs.batch_id && format('--batch-id {0}', github.event.inputs.batch_id) || '' }}
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # add each path separately: `git add -f A B` aborts entirely if
          # A does not exist, so one absent mode-specific file silently
          # discarded the status of a run that had succeeded
          for f in reports/build/asx_extract_status.json \
                   reports/build/asx_deterministic_status.json \
                   reports/build/asx_price_coverage.json \
                   reports/build/asx_parse_failures.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "CI: ASX extraction status ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4 5 6; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              sleep $((RANDOM % 15 + 5))
            done
          fi
